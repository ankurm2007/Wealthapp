[server]
headless = true
fileWatcherType = "poll"
runOnSave = true
# Bind IPv4 loopback so Kite's redirect to http://127.0.0.1:8501 always hits this app.
address = "127.0.0.1"
port = 8501

[browser]
gatherUsageStats = false
# Keep in sync with zerodha.redirect_url in secrets (must match developers.kite.trade).
serverAddress = "127.0.0.1"
serverPort = 8501

# Single light theme only — no [theme.dark], so OS dark mode cannot turn the app black.
[theme]
base = "light"
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
headingFont = "'Literata':https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["34px", "22px", "18px", "15px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

primaryColor = "#2563EB"
backgroundColor = "#F5F8FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
linkColor = "#1D4ED8"
borderColor = "#BFDBFE"
codeBackgroundColor = "#EFF6FF"
codeTextColor = "#1E3A8A"
dataframeBorderColor = "#BFDBFE"
dataframeHeaderBackgroundColor = "#DBEAFE"

greenColor = "#16A34A"
greenBackgroundColor = "#DCFCE7"
greenTextColor = "#166534"
redColor = "#E11D48"
redBackgroundColor = "#FFE4E6"
redTextColor = "#9F1239"
orangeColor = "#EA580C"
yellowColor = "#CA8A04"
blueColor = "#2563EB"
violetColor = "#7C3AED"

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
greenColor = "#059669"
redColor = "#DC2626"
yellowColor = "#D97706"
blueColor = "#2563EB"
violetColor = "#7C3AED"
chartCategoricalColors = ["#2563EB", "#059669", "#7C3AED", "#DC2626", "#D97706", "#0891B2", "#EA580C", "#64748B"]

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
